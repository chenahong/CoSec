# Hermes

[profiles."hermes.gemini_3_5_flash"]
agent = "hermes"
image = "dynacomsec:hermes"
model = "gemini-3.5-flash"
session_mode = "native"
hermes_api_mode = "chat_completions"

[profiles."hermes.gemini_3_5_flash".env]
OPENAI_API_KEY = "${GEMINI_API_KEY}"
OPENAI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai/"

[profiles."hermes.gemini_3_1_pro"]
extends = "hermes.gemini_3_5_flash"
model = "gemini-3.1-pro-preview"

[profiles."hermes.deepseek_4_1_flash"]
agent = "hermes"
image = "dynacomsec:hermes"
model = "deepseek-flash"
session_mode = "native"
hermes_api_mode = "chat_completions"

[profiles."hermes.deepseek_4_1_flash".env]
OPENAI_API_KEY = "${DEEPSEEK_API_KEY}"
OPENAI_BASE_URL = "https://api.deepseek.com"

[profiles."hermes.gpt_5_6_sol"]
agent = "hermes"
image = "dynacomsec:hermes"
model = "gpt-5.6-sol"
session_mode = "native"
hermes_api_mode = "responses"
hermes_streaming = true

[profiles."hermes.gpt_5_6_sol".env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
OPENAI_BASE_URL = "https://api.openai.com/v1"

[profiles."hermes.glm_5_2"]
agent = "hermes"
image = "dynacomsec:hermes"
model = "glm-5.2"
session_mode = "native"
hermes_api_mode = "chat_completions"

[profiles."hermes.glm_5_2".env]
OPENAI_API_KEY = "${ZHIPU_API_KEY}"
OPENAI_BASE_URL = "https://open.bigmodel.cn/api/paas/v4/"

[profiles."hermes.qwen_3_8_max"]
agent = "hermes"
image = "dynacomsec:hermes"
model = "qwen3.8-max"
session_mode = "native"
hermes_api_mode = "chat_completions"

[profiles."hermes.qwen_3_8_max".env]
OPENAI_API_KEY = "${DASHSCOPE_API_KEY}"
OPENAI_BASE_URL = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# Codex

[profiles."codex.gpt_5_6_sol"]
agent = "codex"
image = "dynacomsec:codex"
model = "gpt-5.6-sol"
session_mode = "native"
codex_provider = "openai"
codex_wire_api = "responses"

[profiles."codex.gpt_5_6_sol".env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
OPENAI_BASE_URL = "https://api.openai.com/v1"
