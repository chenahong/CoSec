# Illustrative official-provider profiles corresponding to the 13 harness and
# model combinations reported in the paper. They document names and endpoints,
# but are not a record of every endpoint used for the historical runs.
# Export the referenced API keys in the shell. Do not store credentials here.
# Endpoint and model identifiers were checked against provider documentation
# on 2026-09-26. Request limits below retain the paper's experiment settings.

# OpenClaw

[profiles."openclaw.gemini_3_5_flash"]
agent = "openclaw"
image = "dynacomsec:openclaw"
model = "google/gemini-3.5-flash"
session_mode = "native"
unset = ["OPENAI_API_KEY", "OPENAI_BASE_URL"]

[profiles."openclaw.gemini_3_5_flash".env]
GOOGLE_API_KEY = "${GEMINI_API_KEY}"
GEMINI_API_KEY = "${GEMINI_API_KEY}"

[profiles."openclaw.gemini_3_5_flash".openclaw.models]
default = "google/gemini-3.5-flash"

[profiles."openclaw.gemini_3_5_flash".openclaw.models.providers.google]
apiKey = "${GEMINI_API_KEY}"
api = "google-generative-ai"

[[profiles."openclaw.gemini_3_5_flash".openclaw.models.providers.google.models]]
id = "gemini-3.5-flash"
name = "Gemini 3.5 Flash"
api = "google-generative-ai"
reasoning = true
input = ["text"]
contextWindow = 1048576
maxTokens = 8192

[profiles."openclaw.gemini_3_1_pro"]
extends = "openclaw.gemini_3_5_flash"
model = "google/gemini-3.1-pro-preview"

[profiles."openclaw.gemini_3_1_pro".openclaw.models]
default = "google/gemini-3.1-pro-preview"

[[profiles."openclaw.gemini_3_1_pro".openclaw.models.providers.google.models]]
id = "gemini-3.1-pro-preview"
name = "Gemini 3.1 Pro"
api = "google-generative-ai"
reasoning = true
input = ["text"]
contextWindow = 1048576
maxTokens = 8192

[profiles."openclaw.deepseek_4_1_flash"]
agent = "openclaw"
image = "dynacomsec:openclaw"
model = "deepseek/deepseek-flash"
session_mode = "native"

[profiles."openclaw.deepseek_4_1_flash".env]
OPENAI_API_KEY = "${DEEPSEEK_API_KEY}"
OPENAI_BASE_URL = "https://api.deepseek.com"

[profiles."openclaw.deepseek_4_1_flash".openclaw.models]
default = "deepseek/deepseek-flash"

[profiles."openclaw.deepseek_4_1_flash".openclaw.models.providers.deepseek]
baseUrl = "https://api.deepseek.com"
apiKey = "${DEEPSEEK_API_KEY}"
api = "openai-completions"

[[profiles."openclaw.deepseek_4_1_flash".openclaw.models.providers.deepseek.models]]
id = "deepseek-flash"
name = "DeepSeek V4.1 Flash"
api = "openai-completions"
